[package]
name = "recomp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Static recompiler CLI"

[dependencies]
armv4t = { path = "../armv4t" }
gba-core = { path = "../gba-core" }
recomp-core = { path = "../recomp-core" }
gamedb = { path = "../gamedb" }
winit = "0.30"
softbuffer = "0.4"
libloading = "0.8"
cpal = "0.16"
gilrs = "0.11.2"
input-config = { version = "0.2.0", path = "../input-config" }
screen = { version = "0.2.0", path = "../screen" }
menu = { version = "0.2.0", path = "../menu" }
sha2 = "0.11.0"
dirs = "6.0.0"
toml = "0.8"

[features]
# Per-phase timing counters for the emulated hardware (PPU/APU). Diagnostic
# only: `cargo build -p recomp --features perf-counters` plus
# `RECOMP_PPU_STATS=1` makes `runc` report where the frame time went.
perf-counters = ["gba-core/perf-counters"]
